name: MWP-C Open Entry Call

on:
  schedule:
    # 09:06 Asia/Taipei, Monday-Friday.
    - cron: "6 1 * * 1-5"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Target trading date in YYYY-MM-DD. Leave blank for today."
        required: false
        type: string

concurrency:
  group: mwp-c-open-entry-call-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send-open-entry-call:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID." >&2
            exit 1
          fi

      - name: Send MWP-C open-entry calls
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ inputs.as_of }}" ]; then
            python send_mwp_c_open_entry_calls.py --as-of "${{ inputs.as_of }}"
          else
            python send_mwp_c_open_entry_calls.py
          fi
