name: Daily Stock Signal

on:
  schedule:
    # 18:00 Asia/Taipei, Monday-Friday.
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Target market date in YYYY-MM-DD. Leave blank for today."
        required: false
        type: string

concurrency:
  group: daily-stock-signal-main
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve Taiwan market date
        id: market_date
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.as_of }}
        run: |
          python market_calendar.py --date "$REQUESTED_DATE" --github-output "$GITHUB_OUTPUT"

      - name: Sync and verify market data
        if: steps.market_date.outputs.is_trading_day == 'true'
        shell: bash
        env:
          TARGET_DATE: ${{ steps.market_date.outputs.target_date }}
        run: |
          for attempt in 1 2 3 4; do
            echo "Sync attempt $attempt/4 for $TARGET_DATE"
            if python sync_today.py --workers 6 --mode auto --as-of "$TARGET_DATE" --require-date && \
              python verify_daily_signal_freshness.py --expected-date "$TARGET_DATE" --skip-report-check; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Market data for $TARGET_DATE was still unavailable after four attempts."
              exit 1
            fi
            echo "Waiting 15 minutes for upstream TWSE/TPEx data."
            sleep 900
          done

      - name: Build signal reports
        if: steps.market_date.outputs.is_trading_day == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_MAX_ITEMS: "30"
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            python alert_signals.py --channel telegram --top-lists --top-count 5 --send-empty
          else
            echo "Telegram secrets are not configured; building reports without sending a notification."
            python alert_signals.py --dry-run --top-lists --top-count 5
          fi

      - name: Verify report freshness
        if: steps.market_date.outputs.is_trading_day == 'true'
        run: |
          python verify_daily_signal_freshness.py --expected-date "${{ steps.market_date.outputs.target_date }}"

      - name: Update and verify MWP-C forward cohort
        if: steps.market_date.outputs.is_trading_day == 'true'
        run: |
          python build_mwp_a_strategy_tracking.py
          python verify_mwp_c_forward_records.py --expected-date "${{ steps.market_date.outputs.target_date }}"

      - name: Build static site
        if: steps.market_date.outputs.is_trading_day == 'true'
        shell: pwsh
        run: ./build_site.ps1

      - name: Commit generated data and reports
        if: steps.market_date.outputs.is_trading_day == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          files=(
            data/all_twse/*.csv
            data/all_tpex/*.csv
            reports/daily_signal_alert.json
            reports/daily_signal_alert.csv
            reports/daily_signal_alert.txt
            reports/daily_signal_top_lists.json
            reports/mwp_a_strategy_tracking.json
            reports/mwp_c_forward_records.json
            charts/daily_alert/*.png
          )
          if [ "${#files[@]}" -gt 0 ]; then
            git add -f "${files[@]}"
          fi
          git add .github/workflows/daily-signal.yml build_site.ps1 requirements.txt top_signal_rankings.html
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update daily stock signals"
            git pull --rebase origin main
            git push
          fi

      - name: Configure GitHub Pages
        if: steps.market_date.outputs.is_trading_day == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.market_date.outputs.is_trading_day == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.market_date.outputs.is_trading_day == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy to Cloudflare Pages
        if: steps.market_date.outputs.is_trading_day == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=daily-stock-signal --branch=main
